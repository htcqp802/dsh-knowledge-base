# dsh-knowledge-base bundle patch — `dsh plugin add` 后自动应用（一行命令即激活全部）。
- insert:
    # host 工具：kb_query / kb_import / kb_list / kb_update / kb_delete（任意 profile）
    - id: knowledge-base
      name: 'dsh-knowledge-base'
      config:
        # 分类体系：默认不预置任何分类（通用插件，按需在配置或 UI 中创建）。
        # 未指定分类的条目归入"未分类"。
        categories: []

    # Web 端点：/api/kb/* 与「知识库」管理 UI（仅 web 组合挂载）
    - id: knowledge-base-web
      name: 'dsh-knowledge-base/web'
      config:
        categories: []
