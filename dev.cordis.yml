# dsh-knowledge-base 开发 overlay（web：含知识库 UI 与 /api/kb/* 端点）
#
# 用法：先运行 `node scripts/link-official-deps.mjs` 链接官方 @deepseek-ai 包，
# 并把本插件目录链接进目标 profile 的 node_modules（或用 `dsh plugin add` 安装），
# 然后（在装有 dsh 的官方 checkout 下）：
#   DSH_HOME=$PWD/.dsh-home dsh web --patch ./dev.cordis.yml --port 3091

- insert:
    # host 工具行（包名：走 main = src/index.ts，tsx 运行）
    - id: knowledge-base
      name: 'dsh-knowledge-base'
      config:
        # 默认不预置分类（通用插件）；按需在 UI 中新建目录，或在此配置。
        categories: []

    # Web 上传/管理端点（仅 web 组合需要）
    - id: knowledge-base-web
      name: 'dsh-knowledge-base/web'
      config:
        categories: []
